name: Deploy Critical Illness to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Critical Illness
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Critical Illness tests
        run: npm test

      - name: Validate Pages asset contract
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('manifest.json').read_text())
          html = Path('index.html').read_text()
          app = Path('src/app.js').read_text()
          service_worker = Path('sw.js').read_text()

          assert manifest['start_url'] == './'
          assert manifest['scope'] == './'
          assert manifest['display'] == 'standalone'
          assert 'href="./manifest.json"' in html
          assert 'src="./src/app.js"' in html
          assert 'href="./src/styles.css"' in html
          assert "register('./sw.js')" in app or 'register("./sw.js")' in app
          assert './index.html' in service_worker
          assert './manifest.json' in service_worker
          assert './src/app.js' in service_worker
          assert './src/integration/return-context.js' in service_worker
          assert not re.search(r'(?:href|src)=["\']/[^/]', html)
          print('Critical Illness Pages deployment contract PASS')
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Critical Illness
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Critical Illness site
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -R src _site/src

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
