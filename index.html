<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="description" content="Critical Illness life support reserve planning">
    <link rel="manifest" href="./manifest.json">
    <title>生活支援預備金｜AVA Critical Illness</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <div class="ava-shell" id="app">
      <header class="app-header">
        <a class="brand" href="#/" aria-label="AVA Critical Illness 首頁">
          <span class="brand-mark" aria-hidden="true">CI</span>
          <span><strong>生活支援預備金</strong><small>AVA Critical Illness</small><small class="app-version" id="app-version" aria-label="App version"></small></span>
        </a>
        <nav class="top-nav" aria-label="主要導航">
          <a class="return-ava" href="#return-to-ava" data-return-to-ava aria-label="返回 AVA">← 返回 AVA</a>
        </nav>
      </header>
      <main id="main-content" tabindex="-1"></main>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
    <script>
      (() => {
        const isAdmin = new URLSearchParams(location.search).get('avaEntry') === 'admin';
        if (!isAdmin) return;
        let settled = false;
        const main = document.querySelector('#main-content');
        if (main) main.innerHTML = '<section class="hero" data-admin-startup><span class="eyebrow">AVA Studio · Critical Illness Admin</span><h1>正在驗證 Admin</h1><p class="support">正在建立安全瀏覽器綁定及載入 Official Data。</p></section>';
        const renderFailure = (message) => {
          if (settled) return;
          const main = document.querySelector('#main-content');
          if (!main || !main.querySelector('[data-admin-startup]')) return;
          settled = true;
          main.innerHTML = '<section class="hero" data-ava-mode="admin"><span class="eyebrow">AVA Studio · Critical Illness Admin</span><h1>Admin 啟動失敗</h1><p class="support">Admin 初始化未能完成，Official 資料及寫入功能已鎖定。</p><p class="muted">' + String(message || '請由 AVA Studio 重新開啟。').replace(/[&<>]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char]) ) + '</p><a class="button secondary" href="https://ivancww.github.io/avaplatform/?avaSurface=admin">返回 AVA</a></section>';
        };
        window.addEventListener('error', event => renderFailure(event.error?.message || '前端初始化錯誤。'));
        window.addEventListener('unhandledrejection', event => renderFailure(event.reason?.message || String(event.reason || '前端初始化錯誤。')));
        window.setTimeout(() => renderFailure('Admin 初始化逾時。'), 15000);
      })();
    </script>
    <script type="module" src="./src/app.js?v=0.2.4"></script>
  </body>
</html>
